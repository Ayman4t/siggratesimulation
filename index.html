<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Balcony Night Vibe (قعدة البلكونة بليل)</title>
<style>
:root{color-scheme:dark;--t:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#040406;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:#b9b4ae}
#glow{position:fixed;left:0;top:0;width:900px;height:900px;pointer-events:none;opacity:0;will-change:transform,opacity;background:radial-gradient(circle,rgba(255,120,45,.5),rgba(130,32,10,.18) 38%,transparent 68%)}
#smoke{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#cig{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:36px;margin-left:-18px;display:flex;flex-direction:column;transform-origin:50% 100%;z-index:1}
#filter{height:120px;position:relative;border-radius:0 0 5px 5px;box-shadow:0 8px 18px rgba(0,0,0,.6);
background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,0) 22%,rgba(255,235,200,.38) 42%,rgba(0,0,0,0) 62%,rgba(0,0,0,.65)),
radial-gradient(circle at 20% 30%,rgba(90,50,20,.5) 0 1.2px,transparent 1.7px) 0 0/9px 11px,
radial-gradient(circle at 70% 60%,rgba(255,220,170,.35) 0 1px,transparent 1.5px) 0 0/7px 8px,
radial-gradient(circle at 45% 80%,rgba(70,35,10,.45) 0 1.4px,transparent 2px) 0 0/13px 10px,
repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px),#c88a4e}
#filter::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;border-bottom:1px solid rgba(0,0,0,.45);background:linear-gradient(90deg,#5a3d0a,#c9a13a 22%,#fff0b0 46%,#b88a22 74%,#4d3308)}
#paper{height:280px;overflow:hidden;box-shadow:inset 0 -12px 12px -8px rgba(0,0,0,.3);
background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,0) 24%,rgba(255,255,255,.55) 44%,rgba(0,0,0,0) 68%,rgba(0,0,0,.5)),
repeating-linear-gradient(0deg,rgba(110,100,80,.2) 0 1px,transparent 1px 47px),#efebe0}
#paper{position:relative}#paper::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;opacity:var(--sc,0);background:linear-gradient(180deg,rgba(95,60,28,.75),rgba(150,110,60,.28) 55%,transparent)}
#char{height:0;margin:0 1px;clip-path:polygon(0 30%,12% 0,25% 40%,40% 5%,55% 45%,70% 0,85% 35%,100% 10%,100% 100%,0 100%);background:linear-gradient(180deg,#1a0f09,#4a2a12 60%,#7a3d12)}
#ember{height:16px;position:relative;border-radius:3px 3px 5px 5px/6px 6px 3px 3px;background:#2b2928}
#ember.unlit{background:radial-gradient(circle at 30% 40%,#3a2614 0 2px,transparent 2.5px) 0 0/7px 6px,linear-gradient(90deg,#4a3320,#8a6a45 45%,#3d2a18)}
#ember.dead{background:#2a2928}
#ember::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:calc(1 - var(--t)*1.35);
background:radial-gradient(circle at 25% 40%,rgba(160,160,160,.85) 0 2px,transparent 2.6px) 0 0/13px 9px,radial-gradient(circle at 70% 30%,rgba(195,195,195,.7) 0 1.5px,transparent 2px) 0 0/19px 14px,radial-gradient(circle at 40% 70%,rgba(120,120,125,.7) 0 1.8px,transparent 2.4px) 3px 2px/23px 11px}
#ash{margin:0 1px;height:0;overflow:hidden;border-radius:7px 6px 2px 2px/9px 8px 2px 2px;
background:repeating-linear-gradient(80deg,transparent 0 7px,rgba(25,25,25,.55) 7px 8px,transparent 8px 15px),repeating-linear-gradient(-68deg,transparent 0 11px,rgba(40,40,40,.45) 11px 12px,transparent 12px 21px),linear-gradient(90deg,#4a4a4d,#9c9c9f 40%,#c9c9cb 56%,#6e6e72 86%,#3d3d40);
box-shadow:inset 0 -10px 12px -4px rgba(255,110,40,calc(var(--t)*.7))}
.crush #ember,.crush #char-line{animation:sq .5s forwards}.crush #ash{animation:sq .5s forwards}
@keyframes sq{to{transform:scale(1.3,.3) translateY(4px);opacity:.45}}
#flame{position:absolute;left:50%;bottom:100%;width:22px;height:48px;margin-left:-11px;opacity:0;transition:opacity .15s;transform-origin:50% 100%;pointer-events:none;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;filter:blur(1px);
background:radial-gradient(ellipse at 50% 82%,#fff 0,#ffe9a0 22%,#ff9a2e 52%,rgba(255,80,0,0) 76%);box-shadow:0 0 30px 8px rgba(255,150,40,.3);animation:fl .11s infinite alternate}
#flame::before{content:"";position:absolute;left:25%;right:25%;bottom:0;height:35%;border-radius:50%;background:radial-gradient(#5aa0ff,rgba(60,110,255,0) 80%)}
#flame.on{opacity:1}
@keyframes fl{from{transform:scale(1,.93) skewX(-3deg)}to{transform:scale(.94,1.06) skewX(3deg)}}
#bar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.opt{all:unset;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:14px;color:#8d8882;cursor:pointer}
.opt i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.opt.on{background:rgba(255,255,255,.1);color:#e6e1da}
#hint{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;font-size:15px;font-style:italic;color:#8a857e;z-index:4;pointer-events:none;min-height:20px}
#lighter,#stub{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;transition:opacity .4s}
#lighter{left:0;top:0;bottom:auto;width:0;height:0;perspective:520px;perspective-origin:0 60px;pointer-events:none;transform:none}
#lbody{position:absolute;left:-27px;top:0;width:54px;height:100px;transform-style:preserve-3d;transform-origin:50% 60%}
.lf{position:absolute;backface-visibility:hidden}
.lfr,.lbk{left:0;top:22px;width:54px;height:78px;border-radius:4px 4px 7px 7px;background:linear-gradient(0deg,transparent 56%,rgba(184,34,26,.9) 56% 64%,transparent 64%),linear-gradient(90deg,#2b2d33,#8a8e98 20%,#d3d6de 36%,#7a7e88 54%,#23252a),#555}
.lfr{transform:translateZ(12px)}.lbk{transform:rotateY(180deg) translateZ(12px)}
.llt,.lrt{left:15px;top:22px;width:24px;height:78px;background:linear-gradient(90deg,#15161a,#4f525a 50%,#15161a)}
.llt{transform:rotateY(-90deg) translateZ(27px)}.lrt{transform:rotateY(90deg) translateZ(27px)}
.ltp{left:0;top:10px;width:54px;height:24px;background:linear-gradient(90deg,#4a4e57,#c8ccd4 50%,#4a4e57);transform:rotateX(90deg)}
#lch{position:absolute;left:12px;top:0;width:30px;height:25px;border-radius:7px 7px 2px 2px;background:radial-gradient(circle,rgba(0,0,0,.65) 0 1.5px,transparent 2px) 0 0/7px 7px,linear-gradient(90deg,#34363c,#dfe2e9 32%,#8b8f99 62%,#25272c);transform:translateZ(0)}
#lflame{position:absolute;left:-11px;top:-50px;width:22px;height:50px;opacity:0;transition:opacity .12s;transform-origin:50% 100%;pointer-events:none}
#lflame.on{opacity:1}
#lflame .fi{width:100%;height:100%;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;filter:blur(1px);background:radial-gradient(ellipse at 50% 82%,#fff 0,#ffe9a0 22%,#ff9a2e 52%,rgba(255,80,0,0) 76%);box-shadow:0 0 36px 10px rgba(255,150,40,.35);animation:fl .11s infinite alternate;transform-origin:50% 100%}
.fg{position:absolute;pointer-events:none;height:30px;width:150px;border-radius:15px 8px 8px 15px;background:linear-gradient(180deg,#f0b898 0,#d49270 38%,#a8654a 80%,#7a432f),repeating-linear-gradient(90deg,transparent 0 22px,rgba(90,40,25,.18) 22px 24px);filter:brightness(calc(.16 + var(--t)*.6))}
.fg1{left:20px;bottom:60px;transform:rotate(-7deg);z-index:2;filter:brightness(calc(.16 + var(--t)*.6)) drop-shadow(-3px 4px 4px rgba(0,0,0,.65))}
.fg1::after{content:"";position:absolute;left:7px;top:4px;width:22px;height:13px;border-radius:50%;background:linear-gradient(180deg,#f6d4c4,#d9a58e);opacity:.8}
.fg2{left:-22px;bottom:30px;transform:rotate(5deg);z-index:-1}
#lighter.off{opacity:0;pointer-events:none}
#wheel{position:absolute;left:35px;top:6px;width:20px;height:20px;border-radius:50%;background:repeating-conic-gradient(#c2ae72 0 14deg,#5b4f2a 14deg 28deg);box-shadow:0 2px 5px rgba(0,0,0,.7);cursor:grab;pointer-events:auto;transform:translateZ(14px);transition:transform .25s}#wheel::after{content:"";position:absolute;inset:-16px}
#wheel.spin{transform:translateZ(14px) rotate(200deg)}
#stub{all:unset;position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:13px 30px;border-radius:999px;background:rgba(255,255,255,.09);color:#e6e1da;font-size:16px;cursor:pointer;z-index:5;opacity:0;pointer-events:none;transition:opacity .5s}
#stub.show{opacity:1;pointer-events:auto}
#panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:6;background:rgba(4,4,6,.82);opacity:0;pointer-events:none;transition:opacity .8s;text-align:center;padding:24px}
#panel.show{opacity:1;pointer-events:auto}
#panel p{margin:0;font-size:16px;color:#948f88;line-height:1.5}
#panel b{font-weight:normal;font-size:44px;color:#e6e1da;display:block}
#again{all:unset;margin-top:10px;padding:12px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#d8d3cc;font-size:16px;cursor:pointer}
#ember,#ash,#char-line{filter:url(#organic-burn)}
#ash{position:relative;transform-origin:50% 100%}
#ash::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;opacity:calc(var(--t)*1.15);mix-blend-mode:screen;background:radial-gradient(ellipse 38% 70% at 26% 100%,#fffbe6 0,#ff6a00 38%,#800900 68%,transparent 100%),radial-gradient(ellipse 30% 55% at 70% 100%,#ffd9a0 0,#ff6a00 40%,#800900 70%,transparent 100%),radial-gradient(ellipse 22% 40% at 50% 85%,#ff6a00 0,#800900 60%,transparent 100%)}
#paper::after{content:"";position:absolute;left:0;right:0;top:0;height:12px;opacity:var(--g,0);background:linear-gradient(180deg,rgba(255,150,50,.8),rgba(255,190,110,.35) 60%,transparent);box-shadow:0 2px 12px rgba(255,140,40,.7)}
#filter::after{content:"";position:absolute;left:0;right:0;top:7px;height:16px;opacity:var(--fb,0);background:linear-gradient(180deg,rgba(25,12,4,.92),rgba(60,30,10,.5) 60%,transparent)}
#bloom{position:absolute;left:0;top:0;width:100%;height:16px;border-radius:5px;pointer-events:none}
#stub{left:calc(50% - 5px);transform:translateX(-100%)}
#fresh{all:unset;position:fixed;left:calc(50% + 5px);bottom:calc(58px + env(safe-area-inset-bottom,0px));padding:13px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#d8d3cc;font-size:16px;cursor:pointer;z-index:5;opacity:0;pointer-events:none;transition:opacity .5s}
#fresh.show{opacity:1;pointer-events:auto}
/* ---------- night balcony + tea ---------- */
body{background:radial-gradient(circle at 18% 78%,rgba(255,190,110,.10) 0 2px,transparent 40px),radial-gradient(circle at 72% 70%,rgba(255,220,150,.08) 0 1.5px,transparent 30px),radial-gradient(circle at 88% 82%,rgba(120,170,255,.07) 0 2px,transparent 34px),linear-gradient(#020208,#05060f 70%,#0a0a12)}
#rail{position:fixed;left:0;right:0;bottom:calc(136px + env(safe-area-inset-bottom,0px));height:14px;z-index:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 23px),linear-gradient(#3a2616,#20140a 60%,#120a05);box-shadow:0 -1px 0 rgba(255,200,140,.12)}
#rail::after{content:"";position:absolute;inset:0;opacity:calc(var(--t)*.9);background:radial-gradient(ellipse 170px 14px at 50% 0,rgba(255,130,45,.65),transparent)}
#tea{position:absolute;left:calc(50% - 124px);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:58px;height:92px;transform-origin:50% 100%;z-index:1;--em:0}
#glass{position:absolute;inset:0;cursor:pointer;overflow:hidden;clip-path:polygon(0 0,100% 0,90% 100%,10% 100%);background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 30%,rgba(255,255,255,.1) 70%,rgba(255,255,255,.3)),repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 8px)}
#glass::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--em);background:linear-gradient(270deg,rgba(255,140,50,.75),rgba(255,120,40,.15) 45%,transparent 70%)}
#liq{position:absolute;left:6px;right:6px;bottom:5px;height:70px;transition:height .5s;background:linear-gradient(var(--l1,#8b1e08),var(--l2,#220401));box-shadow:inset 0 0 14px rgba(255,130,50,.35)}
#liq::before{content:"";position:absolute;left:0;right:0;top:-3px;height:6px;border-radius:50%;background:rgba(255,170,100,.4)}
#liq.rip::before{animation:rp .9s}
@keyframes rp{30%{transform:scaleX(.8) translateY(-2px)}60%{transform:scaleX(1.05) translateY(1px)}}
#mint{display:none;position:absolute;left:14px;top:-2px;width:14px;height:8px;border-radius:0 80% 0 80%;background:#3f9a3a;box-shadow:inset -2px -1px 3px #1d5a1c;animation:bob 3s ease-in-out infinite}
#mint.on{display:block}
@keyframes bob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(8deg) translateY(1px)}}
#spoon{position:absolute;left:36px;top:-24px;width:4px;height:84px;border-radius:2px;opacity:.92;background:linear-gradient(90deg,#777,#f0f2f6,#6a6c72);transform:rotate(14deg);transform-origin:50% 100%;cursor:pointer;z-index:2;filter:drop-shadow(0 0 3px rgba(255,150,70,calc(var(--em)*.8)))}
#spoon::before{content:"";position:absolute;inset:-6px -12px}
#spoon::after{content:"";position:absolute;left:-3px;bottom:-4px;width:10px;height:14px;border-radius:50%;background:inherit}
#spoon.stir{animation:st 1.3s ease-in-out}
@keyframes st{0%,100%{transform:rotate(14deg)}15%{transform:rotate(14deg) translateX(-12px)}35%{transform:rotate(14deg) translateX(10px)}55%{transform:rotate(14deg) translateX(-8px)}75%{transform:rotate(14deg) translateX(5px)}}
#deg{position:absolute;left:0;right:0;top:100%;margin-top:3px;text-align:center;font-size:12px;color:#8a857e;pointer-events:none}
#teabar{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5;white-space:nowrap}
.tf{all:unset;padding:6px 11px;border-radius:999px;font-size:13px;color:#8d8882;cursor:pointer}
.tf.on{background:rgba(255,255,255,.1);color:#e6e1da}
#vibe{position:fixed;top:calc(100px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:13px;color:#7d786f;z-index:4;pointer-events:none}
#tip{position:fixed;top:calc(128px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:88%;padding:10px 16px;border-radius:14px;background:rgba(40,12,8,.88);color:#ffd9c2;font-size:15px;text-align:center;z-index:7;opacity:0;pointer-events:none;transition:opacity .4s}
#tip.show{opacity:1}
#refill{all:unset;position:fixed;top:calc(160px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#d8d3cc;font-size:15px;cursor:pointer;z-index:5;opacity:0;pointer-events:none;transition:opacity .5s}
#refill.show{opacity:1;pointer-events:auto}
#tea.up{z-index:3}
#drops{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.dr{position:absolute;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;will-change:transform,opacity}
.tr{position:absolute;border-radius:0 0 4px 4px;will-change:height,opacity}
#spoon.out{animation:sout 1.8s ease-in-out forwards;pointer-events:none}
#spoon.gone{display:none}
#spoon.back{animation:sback .7s ease-out}
@keyframes sout{0%{transform:rotate(14deg)}25%{transform:translate(2px,-66px) rotate(30deg)}38%{transform:translate(18px,-60px) rotate(62deg)}45%{transform:translate(18px,-68px) rotate(56deg)}55%{transform:translate(18px,-60px) rotate(62deg)}62%{transform:translate(18px,-68px) rotate(56deg)}100%{transform:translate(40px,-140px) rotate(100deg);opacity:0}}
@keyframes sback{0%{opacity:0;transform:translateY(-50px) rotate(14deg)}100%{opacity:.92;transform:rotate(14deg)}}
#spoonBtn{all:unset;position:fixed;top:calc(196px + env(safe-area-inset-top,0px));left:calc(50% - 95px);transform:translateX(-50%);padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#d8d3cc;font-size:14px;cursor:pointer;z-index:5;opacity:0;pointer-events:none;transition:opacity .5s;white-space:nowrap}
#spoonBtn.show{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="glow"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="organic-burn" x="-30%" y="-80%" width="160%" height="260%"><feTurbulence id="burn-turb" type="fractalNoise" baseFrequency="0.15" numOctaves="4" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<div id="rail"></div>
<div id="tea"><div id="glass"><div id="liq"><i id="mint"></i></div></div><div id="spoon"></div><div id="deg"></div></div>
<div id="cig">
  <i class="fg fg2"></i><i class="fg fg1"></i><div id="bloom"></div><div id="flame"></div>
  <div id="ash"></div><div id="ember" class="unlit"></div><div id="char-line"></div><div id="paper"></div><div id="filter"></div>
</div>
<canvas id="smoke"></canvas>
<div id="bar">
  <button class="opt" data-s="heavy" style="--c:#c8321e"><i></i>Heavy</button>
  <button class="opt on" data-s="medium" style="--c:#2f6fd0"><i></i>Medium</button>
  <button class="opt" data-s="light" style="--c:#ececec"><i></i>Light</button>
</div>
<div id="teabar" dir="rtl"><button class="tf on" data-f="ink">شاي حبر ثقيل</button><button class="tf" data-f="mint">شاي بنعناع</button><button class="tf" data-f="milk">شاي بلبن</button></div>
<div id="vibe" dir="rtl"></div><div id="tip" dir="rtl"></div><button id="refill" dir="rtl">املا الكوباية</button>
<div id="drops"></div><button id="spoonBtn" dir="rtl">شيل المعلقة</button>
<div id="lighter"><div id="lbody"><div class="lf lbk"></div><div class="lf llt"></div><div class="lf lrt"></div><div class="lf ltp"></div><div id="lch"></div><div class="lf lfr"></div><div id="wheel"></div></div><div id="lflame"><div class="fi"></div></div></div>
<button id="stub">Stub out</button><button id="fresh">Light a fresh one</button>
<div id="hint"></div>
<div id="panel"><p>Real cigarettes replaced today</p><b id="count">0</b><p>Cravings usually fade within a few minutes.</p><button id="again">Light another</button></div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const cig=$('#cig'),ashE=$('#ash'),emb=$('#ember'),chr=$('#char-line'),bloom=$('#bloom'),pap=$('#paper'),flm=$('#flame'),glow=$('#glow'),cv=$('#smoke'),ctx=cv.getContext('2d');
const root=document.documentElement,lighter=$('#lighter'),lbody=$('#lbody'),lfl=$('#lflame'),wheel=$('#wheel'),stubB=$('#stub'),freshB=$('#fresh'),panel=$('#panel'),hintE=$('#hint');

const ST={
  heavy :{burn:.75,air:1.15,af:.85,crack:1.6,hp:1400,dens:1.4},
  medium:{burn:1  ,air:1   ,af:1  ,crack:1  ,hp:2200,dens:1},
  light :{burn:1.3,air:.65 ,af:1.2,crack:.7 ,hp:3800,dens:.7}};
let strength='medium';
const FULL=280, ASH_MAX=35, MIN_PAPER=4;

const S={lit:false,dead:false,ig:0,flameUntil:0,drawing:false,drawT:0,temp:0,paper:FULL,ash:0,
  inhaledSmokeVolume:0,mic:false,vel:0,hold:null,holdTimer:0,releasedAt:0,t:0,vibT:0,emit:0,sideAcc:0,smolder:0,fbK:0,inhDark:0,haze:0,lift:0};
const KEY='cdsim.count';
const today=()=>new Date().toLocaleDateString('en-CA');
function loadCount(){try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');return o.d===today()?o.n:0}catch(e){return 0}}
function saveCount(n){try{localStorage.setItem(KEY,JSON.stringify({d:today(),n}))}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ================= PROCEDURAL AUDIO ================= */
let AC,master,noiseW,A={};

}

const spoonBtn=$('#spoonBtn');
function loadSip(){try{const bin=atob(SIP_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);AC.decodeAudioData(u.buffer,b=>{sipBuf=b},()=>{})}catch(e){}}
function playSip(){if(!AC)return;
  if(sipBuf){const s=AC.createBufferSource();s.buffer=sipBuf;const g=AC.createGain();g.gain.value=1.1;s.connect(g);g.connect(master);s.start()}
  else{burst(.45,'bandpass',1100,5,.32,1.4);setTimeout(()=>burst(1.2,'lowpass',420,.5,.3,.8),520)}}
// spoon: lift out, ring twice on the glass rim, leave. Button toggles it back in.
function ring(i){ping(i?3180:3150,1.1,.12,'sine');ping(i?3215:3185,1.1,.06,'sine');ping(i?4800:4750,.8,.06,'sine');vib(10)}
spoonBtn.addEventListener('click',()=>{initAudio();
  if(TT.out){TT.out=false;spoon.classList.remove('gone','out');spoon.classList.add('back');ping(2200,.2,.06);burst(.25,'lowpass',500,1,.15);spoonBtn.textContent='شيل المعلقة';setTimeout(()=>spoon.classList.remove('back'),750)}
  else{TT.out=true;spoon.classList.remove('stir','back');spoon.classList.add('out');spoonBtn.textContent='رجّع المعلقة';
    [680,990].forEach((d,i)=>setTimeout(()=>ring(i),d));setTimeout(()=>{if(TT.out)spoon.classList.add('gone')},1800)}});
setFlavor('ink');
let last=performance.now();
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;update(dt);render(dt);requestAnimationFrame(frame)}
resize();requestAnimationFrame(frame);
})();
